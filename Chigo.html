<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chigo</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Flashbang */
    #flash {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 10;
      animation: flash 0.6s forwards;
    }

    @keyframes flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .content {
      text-align: center;
      opacity: 0;
      animation: reveal 0.4s forwards;
      animation-delay: 0.5s;
    }

    @keyframes reveal {
      to { opacity: 1; }
    }

    img {
      max-width: 350px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h1 {
      color: red;
      font-size: 2.5em;
      text-shadow: 0 0 10px red;
    }
  </style>
</head>
<body>

  <div id="flash"></div>

  <div class="content">
    <img src="chigo.gif" alt="Chigo no rizz">
    <h1>Chigo has no rizz</h1>
  </div>

</body>
</html>
