<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seraph Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    input {
      width: 200px;
      padding: 8px;
      border-radius: 4px;
      border: none;
      margin-top: 10px;
      text-align: center;
    }
    button {
      margin-top: 10px;
      padding: 8px 20px;
      border-radius: 4px;
      border: none;
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #msg {
      margin-top: 10px;
      font-weight: bold;
      color: red;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Enter Password</h2>
    <input type="password" id="pw" placeholder="Password">
    <br>
    <button onclick="check()">Enter</button>
    <p id="msg"></p>
  </div>

  <script>
    function check() {
      const password = "YazenWasHere"; // ✅ Your password
      const input = document.getElementById("pw").value;

      if (input === password) {
        // sessionStorage clears when browser/tab closes
        sessionStorage.setItem("seraph_auth", "true");
        window.location.href = "index.html";
      } else {
        document.getElementById("msg").textContent = "Wrong password";
      }
    }
  </script>
</body>
</html>
